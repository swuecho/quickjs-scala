# test262 configuration for QuickJS-Scala
# Mirrors the QuickJS C test262.conf format
[config]
style=new
nostrict=yes
strict=yes
mode=default
async=yes
module=yes

# Verbose output shows individual test failures
verbose=no

# Directories
harnessdir=test262/harness
testdir=test262/test

# Output files
errorfile=test262_errors.txt
reportfile=test262_report.txt

[features]
# Features supported by QuickJS-Scala
# 'skip' means skip tests requiring this feature

__getter__
__proto__
__setter__
AggregateError
align-detached-buffer-semantics-with-web-reality=skip
arbitrary-module-namespace-names=skip
array-find-from-last
array-grouping=skip
await-dictionary=skip
Array.fromAsync=skip
Array.prototype.at
Array.prototype.flat
Array.prototype.flatMap
Array.prototype.includes
Array.prototype.values
ArrayBuffer
arraybuffer-transfer
arrow-function
async-functions
async-iteration
Atomics=skip
Atomics.pause=skip
Atomics.waitAsync=skip
BigInt
caller=skip
canonical-tz=skip
change-array-by-copy
class
class-fields-private
class-fields-private-in
class-fields-public
class-methods-private
class-static-block=skip
class-static-fields-private
class-static-fields-public
class-static-methods-private
coalesce-expression
computed-property-names
const
cross-realm=skip
DataView
DataView.prototype.getFloat32
DataView.prototype.getFloat64
DataView.prototype.getInt16
DataView.prototype.getInt32
DataView.prototype.getInt8
DataView.prototype.getUint16
DataView.prototype.getUint32
DataView.prototype.setUint8
decorators=skip
default-parameters
destructuring-assignment
destructuring-binding
dynamic-import
error-cause
error-stack-accessor=skip
Error.isError=skip
explicit-resource-management=skip
exponentiation
export-star-as-namespace-from-module=skip
FinalizationRegistry=skip
Float16Array
Float32Array
Float64Array
for-in-order
for-of
generators
globalThis
hashbang
host-gc-required=skip
immutable-arraybuffer=skip
import-attributes=skip
import-defer=skip
import.meta
joint-iteration=skip
Int16Array
Int32Array
Int8Array
Intl-enumeration=skip
intl-normative-optional=skip
Intl=skip
Intl.DateTimeFormat=skip
Intl.DisplayNames=skip
Intl.DurationFormat=skip
Intl.ListFormat=skip
Intl.Locale=skip
Intl.NumberFormat=skip
Intl.RelativeTimeFormat=skip
Intl.Segmenter=skip
IsHTMLDDA=skip
iterator-helpers=skip
iterator-sequencing=skip
json-modules=skip
json-parse-with-source=skip
json-superset
legacy-regexp=skip
let
logical-assignment-operators
Map
Math.sumPrecise
new.target
nonextensible-applies-to-private=skip
numeric-separator-literal
object-rest
object-spread
Object.fromEntries
Object.hasOwn
Object.is
optional-catch-binding
optional-chaining
Promise
promise-try=skip
promise-with-resolvers
Promise.allSettled
Promise.any
Promise.prototype.finally
Proxy
proxy-missing-checks=skip
Reflect
Reflect.construct
Reflect.set
Reflect.setPrototypeOf
regexp-dotall
regexp-duplicate-named-groups=skip
regexp-lookbehind=skip
regexp-match-indices=skip
regexp-modifiers=skip
regexp-named-groups
regexp-unicode-property-escapes=skip
regexp-v-flag=skip
RegExp.escape=skip
resizable-arraybuffer=skip
rest-parameters
Set
set-methods=skip
ShadowRealm=skip
SharedArrayBuffer=skip
source-phase-imports=skip
stable-array-sort
stable-typedarray-sort
string-trimming
String.fromCodePoint
String.prototype.at
String.prototype.endsWith
String.prototype.includes
String.prototype.isWellFormed
String.prototype.matchAll
String.prototype.replaceAll
String.prototype.toWellFormed
String.prototype.trimEnd
String.prototype.trimStart
super
Symbol
Symbol.asyncIterator
Symbol.hasInstance
Symbol.isConcatSpreadable
Symbol.iterator
Symbol.match
Symbol.matchAll
Symbol.prototype.description
Symbol.replace
Symbol.search
Symbol.species
Symbol.split
Symbol.toPrimitive
Symbol.toStringTag
Symbol.unscopables
symbols-as-weakmap-keys
tail-call-optimization=skip
template
Temporal=skip
top-level-await
TypedArray
TypedArray.prototype.at
u180e=skip
Uint16Array
Uint32Array
Uint8Array
uint8array-base64=skip
Uint8ClampedArray
upsert=skip
WeakMap
WeakRef=skip
WeakSet
well-formed-json-stringify

[exclude]
# Intl tests
test262/test/intl402/

# AnnexB tests (legacy behavior, not priority)
test262/test/annexB/

# Tests requiring features we don't support
test262/test/built-ins/Atomics/
test262/test/built-ins/FinalizationRegistry/
test262/test/built-ins/WeakRef/
test262/test/built-ins/SharedArrayBuffer/

# Async functions that need more mature infrastructure
test262/test/built-ins/AsyncFunction/
test262/test/built-ins/AsyncGeneratorFunction/
test262/test/built-ins/AsyncGeneratorPrototype/
test262/test/built-ins/AsyncFromSyncIteratorPrototype/

# Top-level await
test262/test/language/expressions/await/

[tests]
# Tests are enumerated from testdir
